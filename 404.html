<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Không tìm thấy trang | Đồ Đồng Tiểu Phong</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252623;background:#f7f7f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,620px);padding:56px 32px;background:#fff;border:1px solid #e6e6e2;border-radius:12px;text-align:center;box-shadow:0 20px 60px #3b2b1f0d}
    .mark{width:52px;height:52px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #c2aa9c;border-radius:9px;color:#855737;font-weight:800}
    h1{font-size:clamp(32px,7vw,54px);margin:0 0 16px;letter-spacing:-.05em}p{color:#73776f;line-height:1.7;margin:0 auto 28px;max-width:440px}
    a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 22px;border-radius:6px;background:#262824;color:#fff;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid #d4a67f;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">TP</div>
    <h1>Trang này chưa có.</h1>
    <p>Đường dẫn có thể đã thay đổi. Bạn có thể quay về trang chủ để tiếp tục xem các mẫu quà tặng bằng đồng.</p>
    <a href="./index.html">Về trang chủ</a>
  </main>
</body>
</html>
